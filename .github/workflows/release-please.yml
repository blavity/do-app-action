# Release Please Workflow
#
# Purpose
# Automates versioning, changelog generation, GitHub releases, and floating
# major-version tag management for do-app-action using conventional commits.
#
# How it works:
#   1. On push to main → creates/updates a release PR with changelog + version bump
#   2. On release PR merge → creates GitHub Release + git tag (e.g., v1.2.3)
#   3. After the release tag is created, moves the floating major tag (e.g., v1)
#      so callers using @v1 automatically get the latest stable release.
#
# Conventional commits drive changelog generation:
#   feat(archive): add pagination support    → Features
#   fix(deploy): handle timeout              → Bug Fixes
#   chore: update dependencies               → Miscellaneous
#
# Callers reference:
#   @v1       — latest stable (recommended)
#   @v1.2.3   — pinned to exact version

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # NOTE: there is no `workflows` permission scope. It was declared here
    # until 2026-08-13, which made this file INVALID — GitHub rejected it
    # outright, so every run since was a zero-job startup failure and
    # release-please never actually ran. The failure is silent: the run is
    # attributed to `push`, shows the file path instead of the workflow name,
    # and creates no check run, so nothing surfaces it.
    #
    # The premise was wrong as well as the syntax. The workflow-file push
    # restriction applies to creating or updating workflow FILES with the
    # token; moving a lightweight tag that happens to point at a commit
    # containing workflow files is not affected. If a future change does need
    # to write workflow files, that requires an app token or PAT — no
    # `permissions:` value grants it.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout (for floating tag push)
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move floating major tag
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          MAJOR=$(echo "$TAG" | sed 's/\(v[0-9]*\)\..*/\1/')
          git fetch --tags origin "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG" "$TAG"
          git push origin "$MAJOR" --force
