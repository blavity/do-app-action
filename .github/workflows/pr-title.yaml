# Thin caller so the check context matches every other repo in the org:
# `lint / Lint PR title` (this job's id + the called job's name). A single
# inlined job would emit just `Lint PR title`, which is a different required
# status check — and a required context that never appears blocks every PR.

name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  lint:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/pr-title-lint-local.yaml
